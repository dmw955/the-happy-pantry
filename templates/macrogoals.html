<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md mt-6 border border-teal-600">
  <h2 class="text-xl font-bold mb-4 text-teal-700">My Daily Macro Goals</h2>

  <form id="macro-goals-form" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Calories</label>
        <input type="number" id="calories" class="w-full border rounded-md p-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Protein (g)</label>
        <input type="number" id="protein" class="w-full border rounded-md p-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Carbs (g)</label>
        <input type="number" id="carbs" class="w-full border rounded-md p-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Fat (g)</label>
        <input type="number" id="fat" class="w-full border rounded-md p-2" required />
      </div>
    </div>

    <button type="submit" class="mt-4 px-4 py-2 bg-teal-700 text-white rounded-md hover:bg-teal-800">
      Save Goals
    </button>
    <p id="goal-status" class="text-sm mt-2"></p>
  </form>
</div>
<script src="{{ url_for('static', filename='js/macrogoals.js') }}"></script>
