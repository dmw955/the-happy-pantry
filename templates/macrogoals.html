<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Goals</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFC72C;
      --text-dark: #2E2E2E;
      --text-light: #FFFFFF;
      --background-light: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      padding-top: 80px;
    }

    .navbar {
      background-color: var(--background-light);
      border-bottom: 2px solid var(--accent-color);
      padding: 10px 0;
    }

    .navbar-brand img {
      height: 50px;
      width: auto;
    }

    .navbar-nav .nav-link {
      color: var(--text-dark);
      font-weight: bold;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .form-container {
      max-width: 700px;
      margin: 60px auto;
      background: rgba(255,255,255,0.3);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
    }

    .form-title {
      color: var(--primary-color);
      font-weight: bold;
    }

    .btn-primary-custom {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
    }

    .btn-primary-custom:hover {
      background-color: #C9A000;
    }

    .footer-bg {
      background-color: var(--primary-color);
      color: var(--text-light);
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container px-5">
    <a class="navbar-brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="The Happy Pantry Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('profile') }}">My Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('shopping_list') }}">My Shopping List</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('local_resources') }}">Local Resources</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('macro_tracking') }}">Macro Tracking</a></li>
        <li class="nav-item"><a class="nav-link logout-btn" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container">
  <div class="form-container">
    <h2 class="form-title text-center mb-4">Set Your Macro Goals</h2>

    <form id="macro-goals-form" class="row g-3">
      <div class="col-md-6">
        <label for="gender" class="form-label">Gender</label>
        <select id="gender" class="form-select" required>
          <option value="" selected disabled>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" min="10" max="100" required>
      </div>

      <div class="col-md-6">
        <label for="height" class="form-label">Height (cm)</label>
        <input type="number" class="form-control" id="height" required>
      </div>

      <div class="col-md-6">
        <label for="weight" class="form-label">Weight (kg)</label>
        <input type="number" class="form-control" id="weight" required>
      </div>

      <div class="col-12">
        <label for="activity" class="form-label">Activity Level</label>
        <select id="activity" class="form-select" required>
          <option value="" disabled selected>Select activity level</option>
          <option value="1.2">Sedentary (little or no exercise)</option>
          <option value="1.375">Light (1–3 days/week)</option>
          <option value="1.55">Moderate (3–5 days/week)</option>
          <option value="1.725">Very Active (6–7 days/week)</option>
          <option value="1.9">Super Active (twice daily training)</option>
        </select>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" id="calories">
      <input type="hidden" id="protein">
      <input type="hidden" id="carbs">
      <input type="hidden" id="fat">

      <div class="col-12 text-center">
        <button type="submit" class="btn btn-primary-custom mt-3">Calculate & Save Goals</button>
        <p id="goal-status" class="text-sm mt-2"></p>
      </div>
    </form>
  </div>
</div>

<!-- Footer -->
<footer class="footer-bg">
  <div class="container px-5">
    <p class="m-0">&copy; The Happy Pantry 2026</p>
  </div>
</footer>

<!-- ✅ Load Supabase SDK FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>

<!-- ✅ Inject config -->
<script>
  window.SUPABASE_URL = "{{ SUPABASE_URL }}";
  window.SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
</script>

<!-- ✅ Load Scripts -->
<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/macrogoals.js') }}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/ios-guard.js') }}"></script>

</body>
</html>
