<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe | The Happy Pantry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFC72C;
      --text-dark: #2E2E2E;
      --background-light: #FFFFFF;
    }

    body {
      background-image: url("{{ url_for('static', filename='assets/cookbook.jpg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      position: relative;
    }

    /* Overlay for opacity effect */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .plan-card {
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      padding: 25px;
      max-width: 450px;
      margin: 0 auto;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease-in-out;
    }

    .plan-card:hover {
      transform: scale(1.02);
    }

    .plan-header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
    }

    .plan-price {
      color: var(--accent-color);
      font-size: 1.5em;
      margin: 10px 0;
      font-weight: bold;
    }

    .cta-button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }

    .cta-button:hover {
      background-color: #e5a50c;
    }

    h2.text-center {
      color: black;
      font-weight: bold;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center">Subscribe to The Happy Pantry</h2>

    <div class="plan-card text-center">
      <div class="plan-header">Monthly Plan</div>
      <p class="mt-3">Enjoy full access to all recipes, shopping lists, and meal planning tools for just</p>
      <div class="plan-price">$9.99 / month</div>
      <ul class="text-start mt-3 mb-4" style="list-style-type: none; padding-left: 0;">
        <li>✓ 100+ curated recipes</li>
        <li>✓ Smart Pantry suggestions</li>
        <li>✓ AI-driven ingredient substitutions</li>
        <li>✓ Weekly meal planning tools</li>
      </ul>
      <a href="{{ url_for('subscribe') }}" class="cta-button btn btn-lg w-100">Continue to Subscribe</a>
    </div>
  </div>
</body>
</html>
