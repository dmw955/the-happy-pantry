<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List - The Happy Pantry</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>

<script>
  window.__IS_ANDROID_WEBVIEW__ = typeof Android !== "undefined";
</script>


  <!-- Supabase Config -->
  <script>
    window.SUPABASE_URL = "{{ SUPABASE_URL }}";
    window.SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
  </script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

  <!-- Custom JS -->
  <script src="{{ url_for('static', filename='js/shopping_list.js') }}"></script>

  <!-- Optional Styles -->
  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFC72C;
      --text-dark: #2E2E2E;
      --text-light: #FFFFFF;
      --background-light: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--background-light);
    }

    .navbar {
      background-color: var(--background-light);
      border-bottom: 2px solid var(--accent-color);
      padding: 10px 0;
    }

    .navbar-brand img {
      height: 50px;
      width: auto;
    }

    .navbar-nav .nav-link {
      color: var(--text-dark);
      font-weight: bold;
      transition: color 0.3s ease-in-out;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .btn-action {
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 8px;
    }

  .footer-bg {
    background-color: var(--primary-color);
    color: var(--text-light);
    padding: 20px 0;
    text-align: center;
    font-size: 0.9rem;
  }

  .footer-bg a:hover img {
    transform: scale(1.1);
  }
  .pp-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 998;
}
  </style>
</head>

<body>
  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container px-5">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="The Happy Pantry Logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('profile') }}">My Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('recipes') }}">Recipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('shopping_list') }}">My Shopping List</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('local_resources') }}">Local Resources</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('macro_tracking') }}">Macro Tracking</a></li>
                    <li class="nav-item"><a class="logout-btn nav-link" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ Main Content -->
  <div class="container py-5">
    <h1 class="text-3xl fw-bold text-teal-600 mb-4">🛒 Your Shopping List</h1>

    <div id="listContainer" class="mb-4">
      <p class="text-muted fst-italic">Loading your list...</p>
    </div>

    <div class="d-flex flex-wrap gap-3 mb-4">
      <button id="clearListBtn" class="btn btn-danger btn-action">🧹 Clear Shopping List</button>
      <button id="downloadPdfBtn" class="btn btn-warning text-dark btn-action">📄 Download PDF</button>
    </div>

    <a href="{{ url_for('recipes') }}" class="text-teal-700 text-decoration-underline">← Back to Recipes</a>
  </div>

  <!-- ✅ Footer -->
  <footer class="footer-bg mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 The Happy Pantry</p>
      <a href="https://www.facebook.com/profile.php?id=61576743170575" target="_blank" rel="noopener noreferrer">
        <img src="/static/assets/facebook-icon-gold.svg" alt="Facebook" style="width: 30px; height: 30px; transition: transform 0.3s ease;" />
      </a>
    </div>
  </footer>


  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
