<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - The Happy Pantry</title>

  <!-- Meta -->
  <meta name="description" content="Login - The Happy Pantry">
  <meta name="author" content="The Happy Pantry Team">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}" />

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Custom Styling -->
  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFC72C;
      --text-dark: #2E2E2E;
      --text-light: #FFFFFF;
      --background-light: #FFFFFF;
    }

    body {
      background-color: var(--background-light);
    }

    .navbar {
      background-color: var(--background-light);
      border-bottom: 2px solid var(--accent-color);
      padding: 10px 0;
    }

    .navbar-brand img {
      height: 50px;
    }

    .navbar-nav .nav-link {
      color: var(--text-dark);
      font-weight: bold;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .login-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .form-group {
      position: relative;
      margin-bottom: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border-radius: 8px;
    }

    .form-group i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
    }

    .btn-login {
      background-color: var(--primary-color);
      color: white;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
      width: 100%;
    }

    .btn-login:hover {
      background-color: #006666;
    }

    .footer-bg {
      background-color: var(--primary-color);
      color: var(--text-light);
      padding: 20px 0;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>

  <!-- Supabase -->
  <script>
    const SUPABASE_URL = "{{ SUPABASE_URL }}";
    const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
  </script>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container px-5">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="The Happy Pantry Logo" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact Us</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('login') }}">Login</a></li>
          <li class="nav-item"><a class="btn btn-warning text-dark fw-bold ms-3" href="{{ url_for('signup') }}">Sign Up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Box -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="login-container">
      <h2 class="mb-4 text-primary">Login to Your Account</h2>
      <form id="loginForm">
        <div class="form-group">
          <i class="bi bi-envelope"></i>
          <input type="email" id="loginEmail" required class="form-control" placeholder="Email Address" />
        </div>
        <div class="form-group">
          <i class="bi bi-lock"></i>
          <input type="password" id="loginPassword" required class="form-control" placeholder="Password" />
        </div>
        <div id="loginError" class="text-danger mb-2" style="display:none;"></div>
        <button type="submit" class="btn btn-login">Login</button>
        <a href="{{ url_for('forgot_password') }}" class="d-block mt-3 text-primary">Forgot Password?</a>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-bg mt-auto">
    <div class="container mx-auto px-4 py-2 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 text-center">
      <p class="m-0">&copy; 2025 The Happy Pantry</p>
      <a href="https://www.facebook.com/profile.php?id=61576743170575" target="_blank" rel="noopener noreferrer"
         class="d-inline-flex align-items-center gap-2 text-white text-decoration-none">
        <img src="/static/assets/facebook-icon-gold.svg" alt="Facebook" style="width: 30px; height: 30px;" />
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  {% if session.access_token and session.refresh_token %}
  <script>
    const supabase = supabase || createClient('{{ SUPABASE_URL }}', '{{ SUPABASE_ANON_KEY }}');

    supabase.auth.setSession({
      access_token: "{{ session.access_token }}",
      refresh_token: "{{ session.refresh_token }}"
    }).then(({ data, error }) => {
      if (error) {
        console.error("❌ Supabase session sync failed:", error);
      } else {
        console.log("✅ Supabase session synced successfully");
      }
    });
  </script>
  {% endif %}
</body>
</html>
