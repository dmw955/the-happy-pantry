<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Tracking - The Happy Pantry</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}" />

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>
  <script>
    window.SUPABASE_URL = "{{ SUPABASE_URL }}";
    window.SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- JS Scripts -->
  <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/macrogoals.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/macrotracking.js') }}" defer></script>

  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFC72C;
      --text-dark: #2E2E2E;
      --text-light: #FFFFFF;
      --background-light: #FFFFFF;
    }

    body {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(15px);
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: var(--background-light);
      border-bottom: 2px solid var(--accent-color);
      padding: 10px 0;
    }

    .navbar-brand img {
      height: 50px;
      width: auto;
    }

    .navbar-nav .nav-link {
      color: var(--text-dark);
      font-weight: bold;
      transition: color 0.3s;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .dashboard-container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .card {
      background: rgba(255,255,255,0.3);
      border-radius: 15px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .btn-primary-custom {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      transition: all .3s;
    }

    .btn-primary-custom:hover {
      background-color: #C9A000;
    }

    canvas {
      max-width: 400px;
      margin: 20px auto;
      display: block;
    }

    table {
      background-color: white;
    }

    .footer-bg {
      background-color: var(--primary-color);
      color: var(--text-light);
      padding: 20px 0;
      text-align: center;
      font-size: .9rem;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container px-5">
    <a class="navbar-brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="The Happy Pantry Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('profile') }}">My Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pantrypost') }}">The Pantry Post</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('shopping_list') }}">My Shopping List</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('local_resources') }}">Local Resources</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('macro_tracking') }}">Macro Tracking</a></li>
        <li class="nav-item"><a class="nav-link logout-btn" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="dashboard-container">

  <!-- Track Buttons -->
  <div class="card text-center">
    <h3 class="mb-4">Track Your Meals</h3>
    <div class="d-flex justify-content-center flex-wrap gap-3">
      <button class="btn btn-primary-custom">Add from My Recipes</button>
      <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#mealModal">Manually Add Food</button>
      <button class="btn btn-primary-custom" data-bs-toggle="collapse" data-bs-target="#usdaSearchBox">Search USDA Foods</button>
    </div>
  </div>

  <!-- USDA Search -->
  <div class="collapse mb-4" id="usdaSearchBox">
    <div class="card p-4">
      <form id="usda-search-form" class="mb-3">
        <label for="usda-search-input" class="form-label">Search USDA Food Database</label>
        <input type="text" class="form-control" id="usda-search-input" placeholder="e.g. Lays Potato Chips" required />
        <button type="submit" class="btn btn-primary-custom mt-2">Search</button>
      </form>
      <div id="usda-results"></div>
    </div>
  </div>

  <!-- Today's Chart -->
  <div class="card">
    <h4 class="text-center mb-3">Today's Macro Intake</h4>
    <canvas id="macroCircleChart"></canvas>
  </div>

  <!-- Weekly Summary -->
  <div class="card">
    <h4 class="mb-3">Last 7 Days Summary</h4>
    <div class="table-responsive">
      <table class="table table-bordered table-hover text-center">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Carbs (g)</th>
            <th>Protein (g)</th>
            <th>Fat (g)</th>
            <th>Calories</th>
          </tr>
        </thead>
        <tbody id="weekly-macros"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Meal Modal -->
<div class="modal fade" id="mealModal" tabindex="-1" aria-labelledby="mealModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="meal-form">
        <div class="modal-header">
          <h5 class="modal-title" id="mealModalLabel">Log a Meal or Snack</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="meal-name" class="form-label">Meal Name</label>
            <input type="text" class="form-control" id="meal-name" required>
          </div>
          <div class="row">
            <div class="col">
              <label for="protein" class="form-label">Protein (g)</label>
              <input type="number" class="form-control" id="protein" required>
            </div>
            <div class="col">
              <label for="carbs" class="form-label">Carbs (g)</label>
              <input type="number" class="form-control" id="carbs" required>
            </div>
            <div class="col">
              <label for="fat" class="form-label">Fat (g)</label>
              <input type="number" class="form-control" id="fat" required>
            </div>
          </div>
          <div id="log-status" class="mt-3 text-center"></div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary-custom">Log Meal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer-bg">
  <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center px-4 py-2 gap-2">
    <p class="m-0">&copy; 2025 The Happy Pantry</p>
    <a href="https://www.facebook.com/profile.php?id=61576743170575" target="_blank" rel="noopener noreferrer"
       class="d-inline-flex align-items-center gap-2 text-white text-decoration-none">
      <img src="/static/assets/facebook-icon-gold.svg" alt="Facebook"
           style="width: 30px; height: 30px; transition: transform 0.3s ease;" />
    </a>
  </div>
</footer>


<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
