<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gym Partner Signup | The Happy Pantry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Core site styles -->
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .gym-signup-card {
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      background: #ffffff;
    }

    .gym-badge {
      background: rgba(0,128,128,0.1);
      color: #008080;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <div class="gym-signup-card">

        <div class="text-center mb-4">
          <div class="gym-badge">
            Gym Partner Program
          </div>

          <h2 class="mb-2">Create Your Account</h2>
          <p class="text-muted">
            You’ve been invited to join your gym’s nutrition program powered by
            <strong>The Happy Pantry</strong>.
          </p>
        </div>

<form id="gym-signup-form">

  <!-- Gym context (hidden) -->
  <input type="hidden" id="gym_slug" value="{{ gym_slug }}">

  <div class="mb-3">
    <label for="email" class="form-label">Email address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      placeholder="you@example.com"
      required
    >
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="Create a secure password"
      required
    >
  </div>

  <div class="mb-3">
    <label for="confirm_password" class="form-label">Confirm password</label>
    <input
      type="password"
      class="form-control"
      id="confirm_password"
      placeholder="Re-enter your password"
      required
    >
  </div>

  <button type="submit" class="btn btn-primary w-100 mt-2">
    Create Account
  </button>

</form>


        <div class="text-center mt-4">
          <small class="text-muted">
            Already have an account?
            <a href="/login">Log in here</a>
          </small>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Supabase client init (already used elsewhere) -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<!-- Gym signup logic -->
<script src="{{ url_for('static', filename='js/gym_signup.js') }}"></script>


</body>
</html>
