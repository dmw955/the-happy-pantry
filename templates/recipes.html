    /* ---------- PantryPal FAB + bottom sheet styles ---------- */
    .pp-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0)); width: 64px; height: 64px; border-radius: 999px; border: 2px solid var(--pp-gold); background: var(--pp-bg); display: grid; place-items: center; box-shadow: var(--pp-shadow-1); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; z-index: 9999; transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease; }
    .pp-fab:hover { transform: translateY(-2px); box-shadow: var(--pp-shadow-2); }
    .pp-fab:active { transform: translateY(0); }
    .pp-fab[aria-hidden="true"] { opacity: 0; pointer-events: none; }
    .pp-fab.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 2px solid var(--pp-gold); opacity: .6; animation: pp-pulse 1.6s ease-out infinite; }
    @keyframes pp-pulse { from { transform: scale(1); opacity: .7 } to { transform: scale(1.25); opacity: 0 } }

    .pp-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 9998; }
    .pp-backdrop.open { opacity: 1; pointer-events: auto; }

    .pp-sheet { position: fixed; left: 0; right: 0; bottom: 0; transform: translateY(100%); background: var(--pp-bg); border-top-left-radius: 18px; border-top-right-radius: 18px; box-shadow: var(--pp-shadow-2); z-index: 10000; display: grid; grid-template-rows: auto 1fr auto; max-height: 92dvh; transition: transform .25s ease; }
    .pp-sheet.open { transform: translateY(0); }

    .pp-grabber { width: 48px; height: 5px; background: var(--pp-border); border-radius: 999px; margin: 8px auto 6px; }
    .pp-header { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; border-bottom: 1px solid var(--pp-border); }
    .pp-title { font-weight: 700; color: var(--pp-text); font-size: 16px; line-height: 1.2; }

    .pp-body { padding: 12px 12px 4px; overflow: auto; }
    .pp-msg { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin: 8px 0; }

    .pp-suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 12px 10px; }
    .pp-chip { font-size: 13px; border: 1px solid var(--pp-border); background: #ffffff; border-radius: 999px; padding: 6px 10px; cursor: pointer; }

    .pp-inputbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--pp-border); }
    .pp-input { border: 1px solid var(--pp-border); border-radius: 12px; padding: 10px 12px; font-size: 15px; outline: none; width: 100%; }

  <!-- ▶ PantryPal behavior (now wired to /api/pantrypal) -->
  <script>
    (function(){
      const endpoint = '/api/pantrypal';

      const fab = document.getElementById('ppFab');
      const sheet = document.getElementById('ppSheet');
      const backdrop = document.getElementById('ppBackdrop');
      const closeBtn = document.getElementById('ppClose');
      const input = document.getElementById('ppInput');
      const send = document.getElementById('ppSend');
      const body = document.getElementById('ppBody');
      const suggestions = document.getElementById('ppSuggestions');

      function openSheet() { sheet.classList.add('open'); backdrop.classList.add('open'); fab.setAttribute('aria-expanded', 'true'); setTimeout(()=> input.focus(), 200); trapFocus(); }
      function closeSheet() { sheet.classList.remove('open'); backdrop.classList.remove('open'); fab.setAttribute('aria-expanded', 'false'); releaseFocus(); fab.focus(); }

      fab.addEventListener('click', openSheet);
      backdrop.addEventListener('click', closeSheet);
      closeBtn.addEventListener('click', closeSheet);
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeSheet(); });

      // Trap focus inside sheet
      let prevFocused = null;
      function trapFocus(){ prevFocused = document.activeElement; sheet.addEventListener('keydown', handleTab); }
      function releaseFocus(){ sheet.removeEventListener('keydown', handleTab); if (prevFocused) prevFocused.focus?.(); }
      function handleTab(e){
        if (e.key !== 'Tab') return;
        const focusables = sheet.querySelectorAll('button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])');
        const list = Array.from(focusables).filter(el=>!el.hasAttribute('disabled'));
        const first = list[0];
        const last = list[list.length-1];
        if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
        else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
      }

      // Hide FAB on scroll down
      let lastY = window.scrollY;
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        const goingDown = y > lastY + 10;
        lastY = y;
        if (goingDown) fab.setAttribute('aria-hidden','true');
        else fab.setAttribute('aria-hidden','false');
      }, { passive: true });

      input.addEventListener('input', () => { send.disabled = input.value.trim().length === 0; });
      suggestions.addEventListener('click', (e)=>{
        const chip = e.target.closest('[data-suggest]');
        if (!chip) return;
        input.value = chip.getAttribute('data-suggest');
        send.disabled = false;
        input.focus();
      });

      function addUser(text){
        const wrap = document.createElement('div');
        wrap.className = 'pp-msg user';
        wrap.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        body.appendChild(wrap);
        body.scrollTop = body.scrollHeight;
      }
      function addBot(text, actionsHtml=''){
        const wrap = document.createElement('div');
        wrap.className = 'pp-msg bot';
        wrap.innerHTML = `<div class="bubble">${text}${actionsHtml}</div>`;
        body.appendChild(wrap);
        body.scrollTop = body.scrollHeight;
      }
      function escapeHtml(str){ return str.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

      async function handleSend(){
        const q = input.value.trim();
        if (!q) return;
        addUser(q);
        input.value = ''; send.disabled = true;

        // Build lightweight context from page
        const context = {
          filters: window.currentRecipeFilters || {},
          pantry: window.userPantryItems || [],
          page: 'recipes'
        };

        try {
          const res = await fetch(endpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: q, context })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();

          // Validate minimal shape
          if (!data || typeof data.text !== 'string') throw new Error('Invalid AI response');

          // Render response text
          let actionsHtml = '';
          // Optional: render action chips from AI response
          if (data.actions && typeof data.actions === 'object') {
            const chips = [];
            if (data.actions.applyFilters) {
              chips.push(`<button class="pp-chip" data-action="apply-filters" data-filters='${JSON.stringify(data.actions.applyFilters)}'>Apply filters</button>`);
            }
            if (data.actions.showRecipes) {
              const lim = data.actions.showRecipes.limit ?? 6;
              chips.push(`<button class="pp-chip" data-action="show-recipes" data-limit="${lim}">Show ${lim} matches</button>`);
            }
            if (data.actions.suggestSwap) {
              chips.push(`<button class="pp-chip" data-action="swap" data-swap='${JSON.stringify(data.actions.suggestSwap)}'>Suggest swap</button>`);
            }
            if (chips.length) actionsHtml = `<div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">${chips.join('')}</div>`;
          }
          addBot(data.text, actionsHtml);

          // Immediately dispatch actions so the page can react without clicking chips
          dispatchActions(data.actions || {});
        } catch (err) {
          console.error('PantryPal error:', err);
          addBot('Sorry — I hit a snag. Try again in a moment.');
        }
      }

      send.addEventListener('click', handleSend);
      input.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') handleSend(); });

      // Chip click handlers → dispatch events
      body.addEventListener('click', (e)=>{
        const chip = e.target.closest('.pp-chip');
        if (!chip) return;
        e.preventDefault();
        const action = chip.getAttribute('data-action');
        if (action === 'apply-filters') {
          dispatchActions({ applyFilters: JSON.parse(chip.getAttribute('data-filters')) });
          addBot('✅ Filters applied. Scrolling to results…');
          closeSheet();
        }
        if (action === 'show-recipes') {
          const limit = parseInt(chip.getAttribute('data-limit')||'6',10);
          dispatchActions({ showRecipes: { limit } });
          addBot(`✅ Showing ${limit} highlighted matches.`);
          closeSheet();
        }
        if (action === 'swap') {
          dispatchActions({ suggestSwap: JSON.parse(chip.getAttribute('data-swap')) });
        }
      });

      function dispatchActions(actions){
        if (!actions || typeof actions !== 'object') return;
        if (actions.applyFilters) window.dispatchEvent(new CustomEvent('pantrypal:applyFilters', { detail: actions.applyFilters }));
        if (actions.showRecipes) window.dispatchEvent(new CustomEvent('pantrypal:showRecipes', { detail: actions.showRecipes }));
        if (actions.suggestSwap) window.dispatchEvent(new CustomEvent('pantrypal:suggestSwap', { detail: actions.suggestSwap }));
        // Convenience: scroll to grid if we showed recipes
        if (actions.showRecipes) document.getElementById('recipeContainer')?.scrollIntoView({behavior:'smooth', block:'start'});
      }

      // Swipe down to close (mobile)
      let startY = null, delta = 0;
      sheet.addEventListener('touchstart', (e)=>{ startY = e.touches[0].clientY; delta = 0; }, {passive:true});
      sheet.addEventListener('touchmove', (e)=>{ if(startY==null) return; delta = e.touches[0].clientY - startY; if (delta>0) { sheet.style.transform = `translateY(${Math.min(delta, window.innerHeight)}px)`; } }, {passive:true});
      sheet.addEventListener('touchend', ()=>{ if (delta > 90) { sheet.style.transform = ''; closeSheet(); } else { sheet.style.transform = ''; } startY = null; delta = 0; });

      // Hooks your recipes.js can implement
      window.addEventListener('pantrypal:applyFilters', (e)=>{ /* window.applyRecipeFilters?.(e.detail); */ });
      window.addEventListener('pantrypal:showRecipes', (e)=>{ document.getElementById('recipeContainer')?.scrollIntoView({behavior:'smooth', block:'start'}); });
      window.addEventListener('pantrypal:suggestSwap', (e)=>{ /* show toast/modal with e.detail */ });
    })();
  </script>
</body>
