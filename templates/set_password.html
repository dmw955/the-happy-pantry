<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set Your Password | The Happy Pantry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #f9fafb;
    }
    .container {
      max-width: 500px;
      margin: 5vh auto;
      padding: 3rem 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .logo {
      display: block;
      margin: 0 auto 1rem;
      max-width: 100px;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <img src="https://www.the-happy-pantry.com/static/assets/logo.png" alt="The Happy Pantry Logo" class="logo">
    <h2 class="mb-4">Set Your Password</h2>

    <form id="password-form">
      <div class="mb-3">
        <input type="password" class="form-control" id="new-password" placeholder="New Password" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="confirm-password" placeholder="Confirm Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Save Password</button>
    </form>

    <p id="status" class="mt-3 text-muted"></p>
  </div>

  <script>
    const supabase = supabase.createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}");

    const urlParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = urlParams.get("access_token");

    if (!accessToken) {
      document.getElementById("status").textContent = "❌ Invalid or expired link.";
    } else {
      supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: accessToken // Not actually used, just required
      });

      document.getElementById("password-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;

        if (password !== confirm) {
          document.getElementById("status").textContent = "❌ Passwords do not match.";
          return;
        }

        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          document.getElementById("status").textContent = "❌ " + error.message;
        } else {
          document.getElementById("status").textContent = "✅ Password updated! Redirecting to login...";
          setTimeout(() => {
            window.location.href = "/login";
          }, 2000);
        }
      });
    }
  </script>
</body>
</html>
