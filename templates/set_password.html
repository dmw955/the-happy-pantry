<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set Your Password | The Happy Pantry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="container text-center" style="max-width: 400px;">
    <img src="/static/assets/logo.png" alt="Logo" style="max-width: 100px;" class="mb-4" />
    <h2 class="mb-3 text-success">Set Your Password</h2>
    <p class="text-muted">Welcome to The Happy Pantry! Please set a new password to complete your account setup.</p>

    <form id="password-form" class="mt-4 d-none">
      <div class="mb-3">
        <input type="password" class="form-control" id="new-password" placeholder="New Password" required />
      </div>
      <button type="submit" class="btn btn-success w-100">Save & Continue</button>
    </form>

    <div id="message" class="mt-4 text-danger"></div>
  </div>

  <script>
    const SUPABASE_URL = "{{ SUPABASE_URL }}";
    const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type = hashParams.get('type');

    const passwordForm = document.getElementById("password-form");
    const messageBox = document.getElementById("message");

    if (accessToken && refreshToken && type === "invite") {
      // Set session
      client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
        .then(({ error }) => {
          if (error) {
            messageBox.textContent = "Error verifying session.";
          } else {
            passwordForm.classList.remove("d-none");
          }
        });
    } else {
      messageBox.textContent = "Missing or invalid invitation link.";
    }

    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("new-password").value.trim();

      if (!newPassword) {
        messageBox.textContent = "Password is required.";
        return;
      }

      const { error } = await client.auth.updateUser({ password: newPassword });

      if (error) {
        messageBox.textContent = error.message || "Error updating password.";
      } else {
        window.location.href = "/login";
      }
    });
  </script>
</body>
</html>
